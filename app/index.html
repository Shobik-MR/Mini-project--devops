<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow — A simple task manager to organize your day, one task at a time.">
  <title>TaskFlow — Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <!-- ====== HEADER ====== -->
    <header class="header">
      <div class="header-icon" aria-hidden="true">
        <!-- Clipboard/checklist SVG icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
          <path d="M9 14l2 2 4-4" />
        </svg>
      </div>
      <h1 class="header-title">TaskFlow</h1>
      <p class="version-label">Kubernetes Version 2</p>
      <p class="header-subtitle">Organize your day, one task at a time.</p>
    </header>

    <!-- ====== TASK INPUT ====== -->
    <section class="input-section" aria-label="Add a new task">
      <div class="input-wrapper">
        <input type="text" id="taskInput" class="task-input" placeholder="What do you need to do?" maxlength="200"
          autocomplete="off">
        <button id="addTaskBtn" class="btn-add" aria-label="Add task">
          <!-- Plus icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <span>Add Task</span>
        </button>
      </div>
    </section>

    <!-- ====== TOAST NOTIFICATION ====== -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- ====== STATS DASHBOARD ====== -->
    <section class="stats-section" aria-label="Task statistics">
      <div class="stat-card">
        <span class="stat-number" id="totalCount">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-card stat-completed">
        <span class="stat-number" id="completedCount">0</span>
        <span class="stat-label">Completed</span>
      </div>
      <div class="stat-card stat-pending">
        <span class="stat-number" id="pendingCount">0</span>
        <span class="stat-label">Pending</span>
      </div>
    </section>

    <!-- ====== PROGRESS BAR ====== -->
    <section class="progress-section" aria-label="Completion progress">
      <div class="progress-header">
        <span class="progress-label">Progress</span>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" role="progressbar" aria-valuenow="0" aria-valuemin="0"
          aria-valuemax="100"></div>
      </div>
    </section>

    <!-- ====== TASK LIST ====== -->
    <section class="task-list-section" aria-label="Task list">
      <ul id="taskList" class="task-list">
        <!-- Tasks are rendered here by JavaScript -->
      </ul>

      <!-- Empty state shown when there are no tasks -->
      <div id="emptyState" class="empty-state">
        <div class="empty-icon" aria-hidden="true">
          <!-- Inbox/empty SVG icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
            <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89
              A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
          </svg>
        </div>
        <p class="empty-title">No tasks yet</p>
        <p class="empty-subtitle">Add your first task above to get started!</p>
      </div>
    </section>

    <!-- ====== FOOTER ====== -->
    <footer class="footer">
      <p>TaskFlow &mdash; College Mini Project &bull; Built with HTML, CSS &amp; JavaScript</p>
    </footer>

  </div>

  <!-- JavaScript — loaded at the end so the DOM is ready -->
  <script src="script.js"></script>
</body>

</html>
